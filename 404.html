<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rohit — Product Manager</title>
    <style>
      html, body { margin: 0; background: #413C34; color: #F1EEE5; font-family: Georgia, serif; height: 100%; }
      body { display: flex; align-items: center; justify-content: center; }
      p { color: #9A927F; font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: 0.25em; text-transform: uppercase; }
    </style>
    <script>
      (function () {
        var target = window.location.pathname + window.location.search + window.location.hash;
        sessionStorage.setItem('spa-redirect', target);
        window.location.replace('/');
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to ROHIT — Product Manager</p>
  </body>
</html>
